version: '3.8'

services:
  complaint-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: complaint-consumer
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      # Persist downloaded complaint files
      - complaint-downloads:/app/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  complaint-downloads:
    driver: local
